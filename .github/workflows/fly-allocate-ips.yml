# Запускается вручную из вкладки Actions на GitHub — выделяет бесплатный общий IPv4
# и IPv6 для приложения на Fly.io. Нужен один раз, если после деплоя домен
# <app>.fly.dev не резолвится (DNS_PROBE_STARTED) — значит, адрес не выделен.
#
# Перед запуском: добавить секрет FLY_API_TOKEN в Settings → Secrets and
# variables → Actions (токен — в панели Fly: приложение → Tokens → Create token).
name: Fly — выделить IP-адреса

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Имя приложения на Fly.io'
        required: true
        default: 'a-sha-platform'

jobs:
  allocate-ips:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Allocate shared IPv4 and IPv6
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ips allocate-v4 --shared -a "${{ inputs.app_name }}" || true
          flyctl ips allocate-v6 -a "${{ inputs.app_name }}" || true
          echo "--- Текущие IP-адреса приложения ---"
          flyctl ips list -a "${{ inputs.app_name }}"
